# When content changes (usually a CMS edit in Arabic), keep a single
# "Translations needed" issue listing NL / FR / EN text that is missing, or
# outdated because the Arabic was edited after it was translated.
# The issue closes itself once everything is translated.
name: Translations

on:
  push:
    branches: [main]
    paths: ['src/content/**', 'translations-reviewed.json']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: translations
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: needed to detect outdated translations
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find missing or outdated translations
        id: check
        run: |
          node scripts/check-translations.mjs --markdown report.md
          if node scripts/check-translations.mjs --strict > /dev/null; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          MISSING: ${{ steps.check.outputs.missing }}
        run: |
          TITLE="Translations needed"
          gh label create translations --color FBCA04 --description "Content waiting for NL/FR/EN" 2>/dev/null || true
          NUMBER=$(gh issue list --label translations --state open --json number --jq '.[0].number')

          if [ "$MISSING" = "true" ]; then
            if [ -n "$NUMBER" ]; then
              gh issue edit "$NUMBER" --body-file report.md
            else
              gh issue create --title "$TITLE" --label translations --body-file report.md
            fi
          elif [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --comment "Everything is translated and up to date now."
          fi
