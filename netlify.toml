[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Keep search engines away while the site still has placeholder content
  # (made-up reviews, placeholder phone numbers). Remove this line at launch.
  PUBLIC_NOINDEX = "true"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
